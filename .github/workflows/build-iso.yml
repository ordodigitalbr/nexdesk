name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Gerar a ISO (container Debian 13)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            debian:trixie \
            sh -c 'apt-get update && apt-get install -y sudo && sh build.sh'

      - name: Mostrar resultado
        run: ls -lh ./*.iso

      - uses: actions/upload-artifact@v4
        with:
          name: nexdesk-iso
          path: |
            *.iso
            build.log
          compression-level: 0
          if-no-files-found: error
